name: Apply approved Evia progress source

on:
  push:
    paths:
      - '.github/patch-approved-evia-progress-source.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact progress patch
        run: python .github/patch-approved-evia-progress-source.py
      - name: Verify production build
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit approved change
        run: |
          rm -f .github/patch-approved-evia-progress-source.py .github/workflows/apply-approved-evia-progress-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Use Evia completion state for Nisia progress"
          git push
